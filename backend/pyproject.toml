[project]
name = "knowledge-bridge-backend"
version = "0.2.0"
description = "Local service for Knowledge Bridge: Apple Notes -> Obsidian knowledge graph"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "markdownify>=0.13",
  "beautifulsoup4>=4.12",
  "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "macos: requires macOS with Apple Notes (run with KB_MACOS_TESTS=1)",
  "provider: calls a real AI provider (run with KB_PROVIDER_TESTS=1)",
]
